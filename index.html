<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID · RichClan Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b081a;
            color: #d9d0f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 30px 20px 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 1200px; width: 100%; }
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #3b2b5a;
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .logo-svg { width: 70px; height: 70px; flex-shrink: 0; }
        .logo-svg svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 15px #7a4cff66); }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #b79aff, #7a4cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header .currency {
            margin-left: auto;
            background: #241d3a;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #5b3f8a;
            font-weight: 600;
            font-size: 1.1rem;
            color: #c6b5ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .currency .balance-box {
            background: #0f0c1e;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #5b3f8a;
            font-size: 1rem;
            color: #e5daff;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            margin: 30px 0 50px;
        }
        .service-card {
            background: #18122b;
            border: 1px solid #32284a;
            border-radius: 20px;
            padding: 22px 18px 20px;
            transition: 0.25s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }
        .service-card:hover {
            border-color: #9b7bff;
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(100, 60, 255, 0.25);
        }
        .service-card h3 { font-size: 1.3rem; margin-bottom: 8px; color: #e5daff; }
        .service-card p { color: #a99bc9; font-size: 0.95rem; line-height: 1.5; flex-grow: 1; margin-bottom: 16px; }
        .service-card .price { font-weight: 700; font-size: 1.2rem; color: #b48aff; margin-bottom: 16px; display: block; }
        .service-card button {
            background: #6b47d9;
            border: none;
            border-radius: 40px;
            padding: 12px 0;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            letter-spacing: 0.5px;
        }
        .service-card button:hover { background: #8b6aff; box-shadow: 0 0 20px #6b47d966; }
        .cart-section, .admin-section, .check-section {
            background: #130f21;
            border-radius: 28px;
            padding: 28px 30px;
            border: 1px solid #32284a;
            margin-top: 20px;
        }
        .cart-section h2, .admin-section h2 { font-size: 1.8rem; margin-bottom: 16px; color: #d4c5ff; display: flex; align-items: center; gap: 12px; }
        .cart-section ul, .admin-section ul { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .cart-section li, .admin-section li { padding: 8px 0; border-bottom: 1px solid #26203b; display: flex; justify-content: space-between; align-items: center; font-size: 1rem; }
        .cart-item-info { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .cart-item-info .item-name { flex: 1; }
        .cart-total { font-size: 1.4rem; font-weight: 700; color: #c2adff; margin: 10px 0 20px; }
        .btn-buy, .btn-confirm, .btn-remove {
            background: #a07cff;
            border: none;
            border-radius: 60px;
            padding: 14px 40px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #0b081a;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 0 20px #7a4cff55;
            margin-right: 15px;
        }
        .btn-buy:hover, .btn-confirm:hover { background: #bea5ff; box-shadow: 0 0 40px #7a4cffaa; transform: scale(1.02); }
        .btn-remove {
            background: #4a2a4a;
            color: #d9d0f0;
            padding: 4px 14px;
            font-size: 0.85rem;
            box-shadow: none;
            margin-right: 0;
        }
        .btn-remove:hover { background: #6a3a5a; }
        .btn-danger { background: #4a2a4a; color: #d9d0f0; }
        .btn-danger:hover { background: #6a3a5a; }
        .empty-cart { color: #7a6a9a; font-style: italic; }
        .check-block {
            background: #18122b;
            border-radius: 20px;
            padding: 25px;
            margin: 15px 0;
            border: 1px solid #5b3f8a;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: center;
        }
        .check-block .qr { width: 150px; height: 150px; background: white; padding: 10px; border-radius: 16px; }
        .check-block .qr canvas { width: 100% !important; height: 100% !important; }
        .check-block .info { flex: 1; }
        .check-block .info p { margin: 8px 0; color: #c6b5ff; }
        .check-block .info span { color: #e5daff; font-weight: 600; }
        .check-block .info .code { font-size: 1.8rem; font-weight: 700; color: #b79aff; letter-spacing: 2px; }
        .flex-row { display: flex; align-items: center; flex-wrap: wrap; gap: 15px; }
        .hidden { display: none; }
        .nick-input, .admin-password-input, .give-input {
            background: #0b081a;
            border: 1px solid #3b2b5a;
            color: #d9d0f0;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
        }
        .nick-input { width: 200px; }
        .admin-password-input, .give-input { width: 160px; }
        .nick-input:focus, .admin-password-input:focus, .give-input:focus { border-color: #9b7bff; }
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header .currency { margin-left: 0; }
            .services-grid { grid-template-columns: 1fr; }
            .flex-row { flex-direction: column; align-items: stretch; }
            .nick-input, .admin-password-input, .give-input { width: 100%; }
            .check-block { flex-direction: column; align-items: center; text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== ШАПКА ===== -->
    <header class="header">
        <div class="logo-svg">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polyline points="-10.0,-6.51 -7.27,-3.57 -4.54,-0.64 -1.81,2.3 0.02,4.67" stroke="#9b7bff" stroke-width="1.2" fill="none"/>
                <polyline points="-10.0,-6.51 -6.0,-6.51 -2.0,-6.51 2.0,-6.51 6.0,-6.51 9.99,-6.51" stroke="#9b7bff" stroke-width="1.2" fill="none"/>
                <polyline points="-5.04,-4.53 -4.84,-0.54 -4.74,-0.24" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="-5.04,-4.53 -1.04,-4.53 2.96,-4.53 4.76,-4.53" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="-4.74,-0.24 -0.74,-0.24 3.26,-0.24 4.76,-0.24" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="-4.74,-0.24 -1.73,-2.88 1.28,-5.52 1.34,-5.55" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="0.02,4.67 2.85,1.86 4.76,-0.24" stroke="#7a4cff" stroke-width="1.2" fill="none"/>
                <polyline points="0.02,4.67 2.75,1.75 5.48,-1.17 8.21,-4.09 9.99,-6.51" stroke="#7a4cff" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
                <polyline points="1.34,-5.55 4.36,-2.91 4.76,-2.44" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="4.76,-4.53 4.76,-0.54 4.76,-0.24" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <circle cx="0.02" cy="4.67" r="0.4" fill="#9b7bff" opacity="0.8"/>
                <circle cx="-10.0" cy="-6.51" r="0.4" fill="#7a4cff" opacity="0.6"/>
                <circle cx="9.99" cy="-6.51" r="0.4" fill="#7a4cff" opacity="0.6"/>
            </svg>
        </div>
        <h1>VOID · RichClan</h1>
        <span class="currency">
            💎 VC
            <span class="balance-box" id="header-balance">0</span>
        </span>
    </header>

    <!-- ===== УСЛУГИ ===== -->
    <div id="services-list" class="services-grid"></div>

    <!-- ===== КОРЗИНА ===== -->
    <section class="cart-section">
        <h2>🛒 Корзина</h2>
        <div class="flex-row" style="margin-bottom: 20px;">
            <input type="text" id="player-nick" class="nick-input" placeholder="Ваш игровой ник" required>
            <span style="color:#7a6a9a; font-size:0.9rem;">(обязательно для заказа)</span>
            <button class="btn-confirm" id="check-balance-btn" style="padding:10px 25px; font-size:1rem; margin-right:0;">Проверить баланс</button>
        </div>
        <ul id="cart-items"><li class="empty-cart">Пока пусто</li></ul>
        <div class="cart-total">Итого: <span id="total-price">0</span> VC</div>
        <button class="btn-buy" id="buy-btn">Оформить заказ</button>
    </section>

    <!-- ===== ЧЕК ===== -->
    <section class="check-section hidden" id="check-section">
        <h2>🧾 Ваш чек</h2>
        <div id="check-content"></div>
    </section>

    <!-- ===== АДМИН-ПАНЕЛЬ ===== -->
    <section class="admin-section" id="admin-panel">
        <h2>🔐 Админ-панель</h2>
        <div class="flex-row" style="margin-bottom:15px;">
            <input type="password" id="admin-password" class="admin-password-input" placeholder="Пароль">
            <button class="btn-confirm" id="admin-login-btn" style="padding:10px 25px; font-size:1rem;">Войти</button>
            <button class="btn-danger" id="admin-logout-btn" style="padding:10px 25px; font-size:1rem; display:none;">Выйти</button>
        </div>
        <div id="admin-content">
            <p style="color:#7a6a9a;">Войдите, чтобы управлять заказами и балансами.</p>
        </div>
    </section>

</div>

<script>
    // ============================================================
    // ========== ДАННЫЕ ==========
    // ============================================================
    const ADMIN_PASSWORD = 'void2026';
    let isAdmin = false;
    let cart = [];
    let servicesData = [];
    let currentOrder = null;
    let currentNick = '';

    // ============================================================
    // ========== КОШЕЛЁК (BALANCE) ==========
    // ============================================================
    function getBalances() {
        return JSON.parse(localStorage.getItem('void_balances')) || {};
    }

    function saveBalances(balances) {
        localStorage.setItem('void_balances', JSON.stringify(balances));
    }

    function getBalance(nick) {
        const balances = getBalances();
        return balances[nick] || 0;
    }

    function setBalance(nick, amount) {
        const balances = getBalances();
        balances[nick] = Math.max(0, amount);
        saveBalances(balances);
        if (nick === currentNick) {
            updateHeaderBalance();
        }
    }

    function addBalance(nick, amount) {
        const current = getBalance(nick);
        setBalance(nick, current + amount);
    }

    function updateHeaderBalance() {
        const nick = document.getElementById('player-nick').value.trim();
        if (nick) {
            document.getElementById('header-balance').textContent = getBalance(nick);
        } else {
            document.getElementById('header-balance').textContent = '0';
        }
    }

    // ============================================================
    // ========== ЗАГРУЗКА УСЛУГ ==========
    // ============================================================
    fetch('services.json')
        .then(res => {
            if (!res.ok) throw new Error('Не удалось загрузить услуги');
            return res.json();
        })
        .then(data => {
            servicesData = data;
            renderServices(data);
        })
        .catch(err => {
            document.getElementById('services-list').innerHTML =
                `<p style="color:#a99bc9; grid-column:1/-1; text-align:center;">⚠️ Не удалось загрузить услуги.</p>`;
            console.error(err);
        });

    function renderServices(services) {
        const container = document.getElementById('services-list');
        container.innerHTML = '';
        services.forEach(service => {
            const card = document.createElement('div');
            card.className = 'service-card';
            card.innerHTML = `
                <h3>${service.name}</h3>
                <p>${service.description}</p>
                <span class="price">${service.price} VC</span>
                <button onclick="addToCart(${service.id})">В корзину</button>
            `;
            container.appendChild(card);
        });
    }

    function addToCart(id) {
        const service = servicesData.find(s => s.id === id);
        if (!service) return;
        cart.push(service);
        updateCart();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCart();
    }

    function updateCart() {
        const list = document.getElementById('cart-items');
        const totalSpan = document.getElementById('total-price');
        list.innerHTML = '';
        if (cart.length === 0) {
            list.innerHTML = '<li class="empty-cart">Пока пусто</li>';
            totalSpan.textContent = '0';
            return;
        }
        let sum = 0;
        cart.forEach((item, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="cart-item-info">
                    <span class="item-name">${item.name}</span>
                    <span>${item.price} VC</span>
                    <button class="btn-remove" onclick="removeFromCart(${index})">✕</button>
                </div>
            `;
            list.appendChild(li);
            sum += item.price;
        });
        totalSpan.textContent = sum;
    }

    // ============================================================
    // ========== ГЕНЕРАЦИЯ ЧЕКА ==========
    // ============================================================
    function generateOrderCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 8; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
    }

    function createCheck(nick, items, total, code) {
        const timestamp = new Date().toLocaleString();
        const orderData = {
            code,
            nick,
            items,
            total,
            timestamp,
            confirmed: false
        };

        const orders = JSON.parse(localStorage.getItem('void_orders')) || [];
        orders.push(orderData);
        localStorage.setItem('void_orders', JSON.stringify(orders));

        const qrText = `ЧЕК №${code}\nНик: ${nick}\nСумма: ${total} VC\nДата: ${timestamp}\nСтатус: Ожидает подтверждения`;

        const itemsHtml = items.map(item => `<li><span>${item.name}</span><span>${item.price} VC</span></li>`).join('');

        document.getElementById('check-content').innerHTML = `
            <div class="check-block">
                <div class="qr" id="qr-container"></div>
                <div class="info">
                    <p><span class="code">ЧЕК №${code}</span></p>
                    <p><span>Игрок:</span> ${nick}</p>
                    <p><span>Сумма:</span> ${total} VC</p>
                    <p><span>Дата:</span> ${timestamp}</p>
                    <p><span>Услуги:</span></p>
                    <ul>${itemsHtml}</ul>
                    <p style="color:#7a6a9a; margin-top:10px;">⏳ Статус: <span style="color:#ffb347;">Ожидает подтверждения</span></p>
                </div>
            </div>
        `;

        const qrContainer = document.getElementById('qr-container');
        new QRCode(qrContainer, {
            text: qrText,
            width: 150,
            height: 150,
            colorDark: '#0b081a',
            colorLight: '#ffffff'
        });

        document.getElementById('check-section').classList.remove('hidden');
        currentOrder = orderData;
        renderAdminOrders();
    }

    // ============================================================
    // ========== ОФОРМЛЕНИЕ ЗАКАЗА ==========
    // ============================================================
    document.getElementById('buy-btn').addEventListener('click', () => {
        const nickInput = document.getElementById('player-nick');
        const nick = nickInput.value.trim();

        if (!nick) {
            alert('Укажите ваш игровой ник!');
            nickInput.focus();
            return;
        }
        if (cart.length === 0) {
            alert('Корзина пуста!');
            return;
        }

        const total = cart.reduce((sum, item) => sum + item.price, 0);
        const balance = getBalance(nick);

        if (balance < total) {
            alert(`❌ Недостаточно VC. Ваш баланс: ${balance} VC, а сумма заказа: ${total} VC.`);
            return;
        }

        // Списываем деньги
        addBalance(nick, -total);

        const code = generateOrderCode();
        const items = cart.map(item => ({ name: item.name, price: item.price }));

        createCheck(nick, items, total, code);

        cart = [];
        updateCart();
        nickInput.value = '';
        updateHeaderBalance();
    });

    // ============================================================
    // ========== ПРОВЕРКА БАЛАНСА ==========
    // ============================================================
    document.getElementById('check-balance-btn').addEventListener('click', () => {
        const nick = document.getElementById('player-nick').value.trim();
        if (!nick) {
            alert('Введите ник!');
            return;
        }
        const balance = getBalance(nick);
        alert(`💰 Баланс игрока ${nick}: ${balance} VC`);
        document.getElementById('header-balance').textContent = balance;
        currentNick = nick;
    });

    // ============================================================
    // ========== АДМИН-ПАНЕЛЬ ==========
    // ============================================================
    function renderAdminOrders() {
        const content = document.getElementById('admin-content');
        if (!isAdmin) {
            content.innerHTML = '<p style="color:#7a6a9a;">Войдите, чтобы управлять заказами и балансами.</p>';
            return;
        }

        const orders = JSON.parse(localStorage.getItem('void_orders')) || [];
        const activeOrders = orders.filter(o => !o.confirmed);

        let html = `
            <div style="margin-bottom:25px; background:#18122b; border-radius:16px; padding:20px; border:1px solid #32284a;">
                <h3 style="color:#c6b5ff; margin-bottom:12px;">💎 Выдать VC игроку</h3>
                <div class="flex-row">
                    <input type="text" id="give-nick" class="give-input" placeholder="Ник игрока">
                    <input type="number" id="give-amount" class="give-input" placeholder="Сумма" min="1">
                    <button class="btn-confirm" id="give-btn" style="padding:10px 25px; font-size:1rem;">Выдать</button>
                </div>
                <div id="give-msg" style="color:#7a6a9a; margin-top:8px;"></div>
            </div>
        `;

        if (activeOrders.length === 0) {
            html += '<p style="color:#7a6a9a;">Нет активных заказов.</p>';
        } else {
            activeOrders.forEach((order, idx) => {
                const itemsHtml = order.items.map(item =>
                    `<li><span>${item.name}</span><span>${item.price} VC</span></li>`
                ).join('');
                html += `
                    <div class="order-info" style="background:#18122b; border-radius:16px; padding:15px 20px; margin:15px 0; border-left:4px solid #9b7bff;">
                        <p><span>Код:</span> <span class="order-code" style="background:#0b081a; padding:5px 15px; border-radius:40px; border:1px solid #6b47d9; font-size:1.4rem; font-weight:700; letter-spacing:2px; color:#b79aff; display:inline-block;">${order.code}</span></p>
                        <p><span>Игрок:</span> ${order.nick}</p>
                        <p><span>Время:</span> ${order.timestamp}</p>
                        <p><span>Сумма:</span> ${order.total} VC</p>
                        <p><span>Услуги:</span></p>
                        <ul>${itemsHtml}</ul>
                        <div class="flex-row" style="margin-top:15px;">
                            <button class="btn-confirm" onclick="confirmOrder('${order.code}')" style="padding:10px 25px; font-size:1rem;">✅ Подтвердить</button>
                            <button class="btn-confirm btn-danger" onclick="cancelOrder('${order.code}')" style="padding:10px 25px; font-size:1rem;">❌ Отменить</button>
                        </div>
                    </div>
                `;
            });
        }

        content.innerHTML = html;

        // Обработчик выдачи VC
        document.getElementById('give-btn')?.addEventListener('click', () => {
            const nick = document.getElementById('give-nick').value.trim();
            const amount = parseInt(document.getElementById('give-amount').value.trim());
            const msg = document.getElementById('give-msg');
            if (!nick) { msg.textContent = '❌ Введите ник'; msg.style.color = '#ff6b6b'; return; }
            if (!amount || amount <= 0) { msg.textContent = '❌ Сумма > 0'; msg.style.color = '#ff6b6b'; return; }
            addBalance(nick, amount);
            msg.textContent = `✅ Выдано ${amount} VC игроку ${nick}`;
            msg.style.color = '#b79aff';
            document.getElementById('give-nick').value = '';
            document.getElementById('give-amount').value = '';
            updateHeaderBalance();
        });
    }

    window.confirmOrder = function(code) {
        const orders = JSON.parse(localStorage.getItem('void_orders')) || [];
        const idx = orders.findIndex(o => o.code === code && !o.confirmed);
        if (idx !== -1) {
            orders[idx].confirmed = true;
            localStorage.setItem('void_orders', JSON.stringify(orders));
            alert(`✅ Чек №${code} подтверждён!`);
            renderAdminOrders();
            if (currentOrder && currentOrder.code === code) {
                currentOrder.confirmed = true;
                document.getElementById('check-content').querySelector('.check-block').innerHTML +=
                    `<p style="color:#6fcf97; margin-top:10px;">✅ Статус: Подтверждён</p>`;
            }
        }
    };

    window.cancelOrder = function(code) {
        const orders = JSON.parse(localStorage.getItem('void_orders')) || [];
        const idx = orders.findIndex(o => o.code === code && !o.confirmed);
        if (idx !== -1) {
            // Возвращаем деньги
            const order = orders[idx];
            addBalance(order.nick, order.total);
            orders[idx].confirmed = true;
            localStorage.setItem('void_orders', JSON.stringify(orders));
            alert(`❌ Чек №${code} отменён. Средства возвращены.`);
            renderAdminOrders();
            if (currentOrder && currentOrder.code === code) {
                currentOrder.confirmed = true;
                document.getElementById('check-content').querySelector('.check-block').innerHTML +=
                    `<p style="color:#ff6b6b; margin-top:10px;">❌ Статус: Отменён</p>`;
            }
            updateHeaderBalance();
        }
    };

    // ---- Вход/Выход админа ----
    document.getElementById('admin-login-btn').addEventListener('click', () => {
        const pass = document.getElementById('admin-password').value.trim();
        if (pass === ADMIN_PASSWORD) {
            isAdmin = true;
            document.getElementById('admin-login-btn').style.display = 'none';
            document.getElementById('admin-logout-btn').style.display = 'inline-block';
            renderAdminOrders();
        } else {
            alert('❌ Неверный пароль!');
        }
    });

    document.getElementById('admin-logout-btn').addEventListener('click', () => {
        isAdmin = false;
        document.getElementById('admin-login-btn').style.display = 'inline-block';
        document.getElementById('admin-logout-btn').style.display = 'none';
        document.getElementById('admin-content').innerHTML = '<p style="color:#7a6a9a;">Войдите, чтобы управлять заказами.</p>';
    });

    // ============================================================
    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    // ============================================================
    updateCart();
    renderAdminOrders();
</script>
</body>
</html>
