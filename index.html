<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID · RichClan Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b081a;
            color: #d9d0f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 30px 20px 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #3b2b5a;
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .logo-svg {
            width: 70px;
            height: 70px;
            flex-shrink: 0;
        }
        .logo-svg svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 12px #9b7bff66);
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #b79aff, #7a4cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header .currency {
            margin-left: auto;
            background: #241d3a;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #5b3f8a;
            font-weight: 600;
            font-size: 1.1rem;
            color: #c6b5ff;
        }
        .header .admin-btn {
            background: #2a1f42;
            border: 1px solid #5b3f8a;
            border-radius: 40px;
            padding: 8px 20px;
            color: #c6b5ff;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .header .admin-btn:hover {
            background: #3b2b5a;
            border-color: #9b7bff;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            margin: 30px 0 50px;
        }
        .service-card {
            background: #18122b;
            border: 1px solid #32284a;
            border-radius: 20px;
            padding: 22px 18px 20px;
            transition: 0.25s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }
        .service-card:hover {
            border-color: #9b7bff;
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(100, 60, 255, 0.25);
        }
        .service-card h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: #e5daff;
        }
        .service-card p {
            color: #a99bc9;
            font-size: 0.95rem;
            line-height: 1.5;
            flex-grow: 1;
            margin-bottom: 16px;
        }
        .service-card .price {
            font-weight: 700;
            font-size: 1.2rem;
            color: #b48aff;
            margin-bottom: 16px;
            display: block;
        }
        .service-card button {
            background: #6b47d9;
            border: none;
            border-radius: 40px;
            padding: 12px 0;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            letter-spacing: 0.5px;
        }
        .service-card button:hover {
            background: #8b6aff;
            box-shadow: 0 0 20px #6b47d966;
        }
        .cart-section, .admin-section, .balance-section {
            background: #130f21;
            border-radius: 28px;
            padding: 28px 30px;
            border: 1px solid #32284a;
            margin-top: 20px;
        }
        .balance-section {
            background: #0f0c1e;
            border-color: #3b2b5a;
            text-align: center;
        }
        .balance-section h2 {
            font-size: 1.4rem;
            color: #b79aff;
        }
        .balance-section .amount {
            font-size: 2.8rem;
            font-weight: 700;
            color: #e5daff;
            margin: 10px 0;
        }
        .cart-section h2, .admin-section h2 {
            font-size: 1.8rem;
            margin-bottom: 16px;
            color: #d4c5ff;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cart-section ul, .admin-section ul {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        .cart-section li, .admin-section li {
            padding: 8px 0;
            border-bottom: 1px solid #26203b;
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
        }
        .cart-total {
            font-size: 1.4rem;
            font-weight: 700;
            color: #c2adff;
            margin: 10px 0 20px;
        }
        .btn-buy, .btn-confirm, .btn-give {
            background: #a07cff;
            border: none;
            border-radius: 60px;
            padding: 14px 40px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #0b081a;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 0 20px #7a4cff55;
            margin-right: 15px;
        }
        .btn-buy:hover, .btn-confirm:hover, .btn-give:hover {
            background: #bea5ff;
            box-shadow: 0 0 40px #7a4cffaa;
            transform: scale(1.02);
        }
        .btn-danger {
            background: #4a2a4a;
            color: #d9d0f0;
        }
        .btn-danger:hover {
            background: #6a3a5a;
        }
        .empty-cart {
            color: #7a6a9a;
            font-style: italic;
        }
        .order-code {
            background: #0b081a;
            padding: 15px 25px;
            border-radius: 60px;
            border: 1px solid #6b47d9;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #b79aff;
            display: inline-block;
            margin: 10px 0 20px;
        }
        .order-info {
            background: #18122b;
            border-radius: 16px;
            padding: 15px 20px;
            margin: 15px 0;
            border-left: 4px solid #9b7bff;
        }
        .order-info p {
            margin: 6px 0;
            color: #c6b5ff;
        }
        .order-info span {
            color: #e5daff;
            font-weight: 600;
        }
        .flex-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .hidden {
            display: none;
        }
        .nick-input, .auth-input, .give-input {
            background: #0b081a;
            border: 1px solid #3b2b5a;
            color: #d9d0f0;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
        }
        .nick-input {
            width: 200px;
        }
        .auth-input, .give-input {
            width: 160px;
        }
        .nick-input:focus, .auth-input:focus, .give-input:focus {
            border-color: #9b7bff;
        }
        .auth-box, .give-box {
            background: #18122b;
            padding: 20px 25px;
            border-radius: 20px;
            border: 1px solid #32284a;
            margin: 15px 0;
            max-width: 100%;
        }
        .auth-msg, .give-msg {
            color: #7a6a9a;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .balance-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #26203b;
        }
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header .currency, .header .admin-btn {
                margin-left: 0;
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .services-grid {
                grid-template-columns: 1fr;
            }
            .flex-row {
                flex-direction: column;
                align-items: stretch;
            }
            .nick-input, .auth-input, .give-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ШАПКА -->
    <header class="header">
        <div class="logo-svg">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 6 L6 2 L10 6 L6 10 L2 6 Z" stroke="#9b7bff" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M14 14 L18 10 L14 6 L10 10 L14 14 Z" stroke="#9b7bff" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M6 14 L10 18 L14 14 L10 10 L6 14 Z" stroke="#9b7bff" stroke-width="1.8" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2" fill="#9b7bff" opacity="0.5"/>
            </svg>
        </div>
        <h1>VOID · RichClan</h1>
        <span class="currency">💎 VC</span>
        <button class="admin-btn" id="toggle-admin-btn">🔐 Админ</button>
    </header>

    <!-- БАЛАНС -->
    <section class="balance-section" id="balance-section">
        <h2>💰 Ваш баланс</h2>
        <div class="amount" id="user-balance">0</div>
        <span style="color:#7a6a9a; font-size:0.9rem;">VC</span>
        <div style="margin-top:8px;">
            <input type="text" id="balance-nick" class="nick-input" placeholder="Ваш игровой ник" style="width:200px;">
            <button class="btn-confirm" id="check-balance-btn" style="padding:10px 25px; font-size:1rem;">Показать</button>
        </div>
    </section>

    <!-- УСЛУГИ -->
    <div id="services-list" class="services-grid"></div>

    <!-- КОРЗИНА -->
    <section class="cart-section" id="cart">
        <h2>🛒 Корзина</h2>
        <div class="flex-row" style="margin-bottom: 20px;">
            <input type="text" id="player-nick" class="nick-input" placeholder="Ваш игровой ник" required>
            <span style="color:#7a6a9a; font-size:0.9rem;">(обязательно для заказа)</span>
        </div>
        <ul id="cart-items"><li class="empty-cart">Пока пусто</li></ul>
        <div class="cart-total">Итого: <span id="total-price">0</span> VC</div>
        <button class="btn-buy" id="buy-btn">Оформить заказ</button>
    </section>

    <!-- АДМИН-ПАНЕЛЬ -->
    <section class="admin-section hidden" id="admin-panel">
        <h2>🔐 Админ-панель</h2>
        <div id="admin-content">
            <!-- сюда подставляется содержимое -->
        </div>
    </section>

</div>

<script>
    // ========== ДАННЫЕ ==========
    let cart = [];
    let servicesData = [];
    let activeOrder = null;

    // Хранилище балансов: { 'nick': число }
    let balances = JSON.parse(localStorage.getItem('void_balances')) || {};

    // ========== АВТОРИЗАЦИЯ ==========
    let adminSession = null;
    const adminDB = {
        'admin': 'void2026',
        'fox': 'limusss'
    };

    // ========== ЗАГРУЗКА УСЛУГ ==========
    fetch('services.json')
        .then(res => {
            if (!res.ok) throw new Error('Не удалось загрузить услуги');
            return res.json();
        })
        .then(data => {
            servicesData = data;
            renderServices(data);
        })
        .catch(err => {
            document.getElementById('services-list').innerHTML =
                `<p style="color:#a99bc9; grid-column:1/-1; text-align:center;">⚠️ Не удалось загрузить услуги. Проверьте файл services.json</p>`;
            console.error(err);
        });

    function renderServices(services) {
        const container = document.getElementById('services-list');
        container.innerHTML = '';
        services.forEach(service => {
            const card = document.createElement('div');
            card.className = 'service-card';
            card.innerHTML = `
                <h3>${service.name}</h3>
                <p>${service.description}</p>
                <span class="price">${service.price} VC</span>
                <button onclick="addToCart(${service.id})">В корзину</button>
            `;
            container.appendChild(card);
        });
    }

    // ========== КОРЗИНА ==========
    function addToCart(id) {
        const service = servicesData.find(s => s.id === id);
        if (!service) return;
        cart.push(service);
        updateCart();
    }

    function updateCart() {
        const list = document.getElementById('cart-items');
        const totalSpan = document.getElementById('total-price');
        list.innerHTML = '';
        if (cart.length === 0) {
            list.innerHTML = '<li class="empty-cart">Пока пусто</li>';
            totalSpan.textContent = '0';
            return;
        }
        let sum = 0;
        cart.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${item.name}</span><span>${item.price} VC</span>`;
            list.appendChild(li);
            sum += item.price;
        });
        totalSpan.textContent = sum;
    }

    // ========== БАЛАНС ==========
    function getBalance(nick) {
        return balances[nick] || 0;
    }

    function setBalance(nick, amount) {
        balances[nick] = Math.max(0, amount);
        localStorage.setItem('void_balances', JSON.stringify(balances));
    }

    function addBalance(nick, amount) {
        const current = getBalance(nick);
        setBalance(nick, current + amount);
    }

    document.getElementById('check-balance-btn').addEventListener('click', () => {
        const nick = document.getElementById('balance-nick').value.trim();
        if (!nick) {
            alert('Введите ник');
            return;
        }
        document.getElementById('user-balance').textContent = getBalance(nick);
    });

    // ========== ГЕНЕРАЦИЯ КОДА ==========
    function generateOrderCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 8; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
    }

    // ========== ОФОРМЛЕНИЕ ЗАКАЗА ==========
    document.getElementById('buy-btn').addEventListener('click', () => {
        const nickInput = document.getElementById('player-nick');
        const nick = nickInput.value.trim();

        if (!nick) {
            alert('Пожалуйста, укажите ваш игровой ник!');
            nickInput.focus();
            return;
        }

        if (cart.length === 0) {
            alert('Корзина пуста! Добавьте услуги.');
            return;
        }

        if (activeOrder && !activeOrder.confirmed) {
            if (!confirm('У вас уже есть активный заказ. Заменить его новым?')) {
                return;
            }
        }

        const code = generateOrderCode();
        const total = cart.reduce((sum, item) => sum + item.price, 0);

        // Проверка баланса
        if (getBalance(nick) < total) {
            alert(`❌ Недостаточно VC. Ваш баланс: ${getBalance(nick)} VC`);
            return;
        }

        // Списание
        addBalance(nick, -total);

        const items = cart.map(item => ({ name: item.name, price: item.price }));

        activeOrder = {
            code: code,
            nick: nick,
            items: items,
            total: total,
            timestamp: new Date().toLocaleString(),
            confirmed: false
        };

        cart = [];
        updateCart();
        nickInput.value = '';

        renderAdminPanel();
        document.getElementById('user-balance').textContent = getBalance(nick);

        alert(`✅ Заказ оформлен!\nКод: ${code}\nНик: ${nick}\nСумма: ${total} VC\n\nКод действителен до подтверждения администратором.`);
    });

    // ========== АДМИН-ПАНЕЛЬ ==========
    function renderAdminPanel() {
        const content = document.getElementById('admin-content');

        if (!adminSession) {
            content.innerHTML = `
                <div class="auth-box">
                    <p style="color:#c6b5ff; margin-bottom:15px;">Войдите как администратор</p>
                    <div class="flex-row">
                        <input type="text" id="admin-login" class="auth-input" placeholder="Логин">
                        <input type="password" id="admin-password" class="auth-input" placeholder="Пароль">
                        <button class="btn-confirm" id="admin-login-btn">Войти</button>
                    </div>
                    <div id="auth-msg" class="auth-msg"></div>
                    <div style="margin-top:12px; border-top:1px solid #26203b; padding-top:12px;">
                        <p style="font-size:0.85rem; color:#7a6a9a;">Нет аккаунта? <button id="show-register-btn" style="background:none; border:none; color:#9b7bff; cursor:pointer; text-decoration:underline;">Зарегистрироваться</button></p>
                        <div id="register-box" class="hidden" style="margin-top:10px;">
                            <div class="flex-row">
                                <input type="text" id="reg-login" class="auth-input" placeholder="Новый логин">
                                <input type="password" id="reg-password" class="auth-input" placeholder="Пароль">
                                <button class="btn-confirm" id="register-btn">Создать</button>
                            </div>
                            <div id="reg-msg" class="auth-msg"></div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('admin-login-btn').addEventListener('click', () => {
                const login = document.getElementById('admin-login').value.trim();
                const password = document.getElementById('admin-password').value.trim();
                const msg = document.getElementById('auth-msg');

                if (adminDB[login] && adminDB[login] === password) {
                    adminSession = { login };
                    msg.textContent = '✅ Вход выполнен';
                    msg.style.color = '#b79aff';
                    renderAdminPanel();
                } else {
                    msg.textContent = '❌ Неверный логин или пароль';
                    msg.style.color = '#ff6b6b';
                }
            });

            document.getElementById('show-register-btn').addEventListener('click', () => {
                document.getElementById('register-box').classList.toggle('hidden');
            });

            document.getElementById('register-btn').addEventListener('click', () => {
                const login = document.getElementById('reg-login').value.trim();
                const password = document.getElementById('reg-password').value.trim();
                const msg = document.getElementById('reg-msg');

                if (!login || !password) {
                    msg.textContent = '❌ Заполните оба поля';
                    msg.style.color = '#ff6b6b';
                    return;
                }
                if (adminDB[login]) {
                    msg.textContent = '❌ Логин уже занят';
                    msg.style.color = '#ff6b6b';
                    return;
                }
                adminDB[login] = password;
                msg.textContent = '✅ Аккаунт создан! Войдите';
                msg.style.color = '#b79aff';
                document.getElementById('reg-login').value = '';
                document.getElementById('reg-password').value = '';
                setTimeout(() => {
                    document.getElementById('register-box').classList.add('hidden');
                }, 1500);
            });

            return;
        }

        // Админ авторизован
        let ordersHtml = '';
        if (activeOrder && !activeOrder.confirmed) {
            const itemsList = activeOrder.items.map(item =>
                `<li><span>${item.name}</span><span>${item.price} VC</span></li>`
            ).join('');
            ordersHtml = `
                <div class="order-info">
                    <p><span>Код заказа:</span> <span class="order-code">${activeOrder.code}</span></p>
                    <p><span>Игрок:</span> ${activeOrder.nick}</p>
                    <p><span>Дата и время:</span> ${activeOrder.timestamp}</p>
                    <p><span>Сумма:</span> ${activeOrder.total} VC</p>
                    <p><span>Услуги:</span></p>
                    <ul>${itemsList}</ul>
                </div>
                <div class="flex-row">
                    <button class="btn-confirm" id="confirm-order-btn">✅ Подтвердить</button>
                    <button class="btn-confirm btn-danger" id="cancel-order-btn">❌ Отменить</button>
                </div>
            `;
        } else {
            ordersHtml = `<p style="color:#7a6a9a;">Нет активных заказов.</p>`;
        }

        // Блок выдачи VC
        const giveHtml = `
            <div class="give-box">
                <h3 style="color:#c6b5ff; margin-bottom:12px;">💎 Выдать VC</h3>
                <div class="flex-row">
                    <input type="text" id="give-nick" class="give-input" placeholder="Ник игрока">
                    <input type="number" id="give-amount" class="give-input" placeholder="Сумма" min="1">
                    <button class="btn-give" id="give-btn">Выдать</button>
                </div>
                <div id="give-msg" class="give-msg"></div>
            </div>
        `;

        content.innerHTML = `
            ${ordersHtml}
            <hr style="border-color:#26203b; margin:25px 0;">
            ${giveHtml}
            <div style="margin-top:20px;">
                <button class="btn-danger" id="admin-logout-btn">🚪 Выйти</button>
            </div>
        `;

        // Обработчики для заказов
        document.getElementById('confirm-order-btn')?.addEventListener('click', () => {
            if (activeOrder && !activeOrder.confirmed) {
                activeOrder.confirmed = true;
                alert(`✅ Заказ ${activeOrder.code} подтверждён!`);
                renderAdminPanel();
            }
        });

        document.getElementById('cancel-order-btn')?.addEventListener('click', () => {
            if (activeOrder && !activeOrder.confirmed) {
                if (confirm(`Отменить заказ ${activeOrder.code}?`)) {
                    // Возвращаем средства
                    addBalance(activeOrder.nick, activeOrder.total);
                    activeOrder = null;
                    renderAdminPanel();
                }
            }
        });

        // Обработчик выдачи VC
        document.getElementById('give-btn')?.addEventListener('click', () => {
            const nick = document.getElementById('give-nick').value.trim();
            const amount = parseInt(document.getElementById('give-amount').value.trim());
            const msg = document.getElementById('give-msg');

            if (!nick) {
                msg.textContent = '❌ Введите ник игрока';
                msg.style.color = '#ff6b6b';
                return;
            }
            if (!amount || amount <= 0) {
                msg.textContent = '❌ Введите корректную сумму (больше 0)';
                msg.style.color = '#ff6b6b';
                return;
            }

            addBalance(nick, amount);
            msg.textContent = `✅ Выдано ${amount} VC игроку ${nick}`;
            msg.style.color = '#b79aff';
            document.getElementById('give-nick').value = '';
            document.getElementById('give-amount').value = '';
        });

        document.getElementById('admin-logout-btn')?.addEventListener('click', () => {
            adminSession = null;
            renderAdminPanel();
        });
    }

    // ========== ПОКАЗАТЬ/СКРЫТЬ АДМИН-ПАНЕЛЬ ==========
    const adminPanel = document.getElementById('admin-panel');
    document.getElementById('toggle-admin-btn').addEventListener('click', () => {
        adminPanel.classList.toggle('hidden');
        if (!adminPanel.classList.contains('hidden')) {
            renderAdminPanel();
        }
    });

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    updateCart();
</script>
</body>
</html>
