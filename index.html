<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>VOID – Клан</title>
    
    <!-- Шрифт Minecraft (Minecraftia) -->
    <link href="https://fonts.googleapis.com/css2?family=Minecraft&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0b081a;
            color: #d9d0f0;
            font-family: 'Minecraft', 'Segoe UI', monospace;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
        }
        
        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid #3b2b5a;
            padding-bottom: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            background: transparent;
            color: #7a6a9a;
            border: none;
            padding: 12px 28px;
            font-size: 1.2rem;
            font-family: 'Minecraft', monospace;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 12px 12px 0 0;
            letter-spacing: 1px;
        }
        
        .tab-btn:hover {
            color: #b79aff;
            background: #1f1735;
        }
        
        .tab-btn.active {
            color: #d4c5ff;
            background: #1f1735;
            border-bottom: 3px solid #9b7bff;
            box-shadow: 0 0 20px #7a4cff33;
        }
        
        /* ===== КОНТЕНТ ВКЛАДОК ===== */
        .tab-content {
            display: none;
            padding: 20px 0;
            animation: fade 0.3s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ===== ЗАГОЛОВКИ ===== */
        h2 {
            color: #d4c5ff;
            font-family: 'Minecraft', monospace;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        
        /* ===== КНОПКИ ===== */
        .btn {
            background: #2a1a3a;
            color: #d9d0f0;
            border: 1px solid #5a4a7a;
            border-radius: 12px;
            padding: 10px 25px;
            font-family: 'Minecraft', monospace;
            cursor: pointer;
            transition: 0.25s;
        }
        
        .btn:hover {
            background: #3a2a5a;
            border-color: #9b7bff;
            box-shadow: 0 0 20px #7a4cff44;
        }
        
        .btn-primary {
            background: #a07cff;
            border: none;
            color: #0b081a;
            font-weight: bold;
        }
        
        .btn-primary:hover {
            background: #bea5ff;
            box-shadow: 0 0 40px #7a4cffaa;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ===== НАВИГАЦИЯ ===== -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="shop">🛒 Магазин</button>
        <button class="tab-btn" data-tab="network">📡 Сеть</button>
        <button class="tab-btn" data-tab="rules">📜 Правила</button>
    </div>

    <!-- ===== ВКЛАДКА 1: МАГАЗИН ===== -->
    <div id="shop" class="tab-content active">
        <h2>🛒 Магазин VOID</h2>
        <!-- Сюда пиши свой код магазина (товары, корзина, INFINITY) -->
        <p style="color:#7a6a9a;">Тут будет магазин с INFINITY.</p>
    </div>

    <!-- ===== ВКЛАДКА 2: СЕТЬ ===== -->
    <div id="network" class="tab-content">
        <h2>📡 Сеть клана</h2>
        <!-- Сюда пиши таблицу участников, ранги и т.д. -->
        <p style="color:#7a6a9a;">Тут будет список членов клана.</p>
    </div>

    <!-- ===== ВКЛАДКА 3: ПРАВИЛА ===== -->
    <div id="rules" class="tab-content">
        <h2>📜 Правила клана</h2>
        <!-- Сюда пиши правила (можно загружать из Firebase через JS) -->
        <p style="color:#7a6a9a;">Тут будут правила клана.</p>
    </div>

</div>

<script>
    // ============================================================
    // ========== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ==========
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            // Убираем active у всех кнопок
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Убираем active у всех контентов
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            // Показываем нужный контент
            const tabId = btn.dataset.tab;
            document.getElementById(tabId).classList.add('active');
        });
    });
</script

</body>
</html>
