<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID · Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        /* ===== СТИЛИ (без изменений) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b081a;
            color: #d9d0f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 30px 20px 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 1200px; width: 100%; }
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #3b2b5a;
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .logo-svg { width: 70px; height: 70px; flex-shrink: 0; }
        .logo-svg svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 15px #7a4cff66); }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #b79aff, #7a4cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header .currency {
            margin-left: auto;
            background: #241d3a;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #5b3f8a;
            font-weight: 600;
            font-size: 1.1rem;
            color: #c6b5ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .currency .balance-box {
            background: #0f0c1e;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #5b3f8a;
            font-size: 1rem;
            color: #e5daff;
        }
        .header .session-info {
            font-size: 0.85rem;
            color: #7a6a9a;
            background: #130f21;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #32284a;
        }
        .header .session-info span { color: #b79aff; font-weight: 600; }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            margin: 30px 0 50px;
        }
        .service-card {
            background: #18122b;
            border: 1px solid #32284a;
            border-radius: 20px;
            padding: 22px 18px 20px;
            transition: 0.25s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }
        .service-card:hover {
            border-color: #9b7bff;
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(100, 60, 255, 0.25);
        }
        .service-card h3 { font-size: 1.3rem; margin-bottom: 8px; color: #e5daff; }
        .service-card p { color: #a99bc9; font-size: 0.95rem; line-height: 1.5; flex-grow: 1; margin-bottom: 16px; }
        .service-card .price { font-weight: 700; font-size: 1.2rem; color: #b48aff; margin-bottom: 16px; display: block; }
        .service-card button {
            background: #6b47d9;
            border: none;
            border-radius: 40px;
            padding: 12px 0;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            letter-spacing: 0.5px;
        }
        .service-card button:hover { background: #8b6aff; box-shadow: 0 0 20px #6b47d966; }
        .cart-section, .check-section {
            background: #130f21;
            border-radius: 28px;
            padding: 28px 30px;
            border: 1px solid #32284a;
            margin-top: 20px;
        }
        .cart-section h2 { font-size: 1.8rem; margin-bottom: 16px; color: #d4c5ff; display: flex; align-items: center; gap: 12px; }
        .cart-section ul { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .cart-section li { padding: 8px 0; border-bottom: 1px solid #26203b; display: flex; justify-content: space-between; align-items: center; font-size: 1rem; }
        .cart-item-info { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .cart-item-info .item-name { flex: 1; }
        .cart-total { font-size: 1.4rem; font-weight: 700; color: #c2adff; margin: 10px 0 20px; }
        .btn-buy, .btn-confirm, .btn-remove {
            background: #a07cff;
            border: none;
            border-radius: 60px;
            padding: 14px 40px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #0b081a;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 0 20px #7a4cff55;
            margin-right: 15px;
        }
        .btn-buy:hover, .btn-confirm:hover { background: #bea5ff; box-shadow: 0 0 40px #7a4cffaa; transform: scale(1.02); }
        .btn-remove {
            background: #4a2a4a;
            color: #d9d0f0;
            padding: 4px 14px;
            font-size: 0.85rem;
            box-shadow: none;
            margin-right: 0;
        }
        .btn-remove:hover { background: #6a3a5a; }
        .btn-danger { background: #4a2a4a; color: #d9d0f0; }
        .btn-danger:hover { background: #6a3a5a; }
        .empty-cart { color: #7a6a9a; font-style: italic; }
        .check-block {
            background: #18122b;
            border-radius: 20px;
            padding: 25px;
            margin: 15px 0;
            border: 1px solid #5b3f8a;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: center;
        }
        .check-block .qr { width: 150px; height: 150px; background: white; padding: 10px; border-radius: 16px; }
        .check-block .qr canvas { width: 100% !important; height: 100% !important; }
        .check-block .info { flex: 1; }
        .check-block .info p { margin: 8px 0; color: #c6b5ff; }
        .check-block .info span { color: #e5daff; font-weight: 600; }
        .check-block .info .code { font-size: 1.8rem; font-weight: 700; color: #b79aff; letter-spacing: 2px; }
        .flex-row { display: flex; align-items: center; flex-wrap: wrap; gap: 15px; }
        .hidden { display: none; }
        .nick-input, .password-input {
            background: #0b081a;
            border: 1px solid #3b2b5a;
            color: #d9d0f0;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
        }
        .nick-input { width: 200px; }
        .password-input { width: 160px; }
        .nick-input:focus, .password-input:focus { border-color: #9b7bff; }
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header .currency { margin-left: 0; }
            .services-grid { grid-template-columns: 1fr; }
            .flex-row { flex-direction: column; align-items: stretch; }
            .nick-input, .password-input { width: 100%; }
            .check-block { flex-direction: column; align-items: center; text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== ШАПКА ===== -->
    <header class="header">
        <div class="logo-svg">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polyline points="-10.0,-6.51 -7.27,-3.57 -4.54,-0.64 -1.81,2.3 0.02,4.67" stroke="#9b7bff" stroke-width="1.2" fill="none"/>
                <polyline points="-10.0,-6.51 -6.0,-6.51 -2.0,-6.51 2.0,-6.51 6.0,-6.51 9.99,-6.51" stroke="#9b7bff" stroke-width="1.2" fill="none"/>
                <polyline points="-5.04,-4.53 -4.84,-0.54 -4.74,-0.24" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="-5.04,-4.53 -1.04,-4.53 2.96,-4.53 4.76,-4.53" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="-4.74,-0.24 -0.74,-0.24 3.26,-0.24 4.76,-0.24" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="-4.74,-0.24 -1.73,-2.88 1.28,-5.52 1.34,-5.55" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="0.02,4.67 2.85,1.86 4.76,-0.24" stroke="#7a4cff" stroke-width="1.2" fill="none"/>
                <polyline points="0.02,4.67 2.75,1.75 5.48,-1.17 8.21,-4.09 9.99,-6.51" stroke="#7a4cff" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
                <polyline points="1.34,-5.55 4.36,-2.91 4.76,-2.44" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="4.76,-4.53 4.76,-0.54 4.76,-0.24" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <circle cx="0.02" cy="4.67" r="0.4" fill="#9b7bff" opacity="0.8"/>
                <circle cx="-10.0" cy="-6.51" r="0.4" fill="#7a4cff" opacity="0.6"/>
                <circle cx="9.99" cy="-6.51" r="0.4" fill="#7a4cff" opacity="0.6"/>
            </svg>
        </div>
        <h1>VOID · RichClan</h1>
        <span class="currency">
            💎 VC
            <span class="balance-box" id="header-balance">0</span>
        </span>
        <span class="session-info">👤 <span id="session-nick">Не выбран</span></span>
    </header>

    <!-- ===== УСЛУГИ ===== -->
    <div id="services-list" class="services-grid"></div>

    <!-- ===== КОРЗИНА ===== -->
    <section class="cart-section">
        <h2>🛒 Корзина</h2>
        <div class="flex-row" style="margin-bottom: 20px;">
            <input type="text" id="player-nick" class="nick-input" placeholder="Ваш игровой ник" required>
            <input type="password" id="player-password" class="password-input" placeholder="Пароль от ника" required>
            <button class="btn-confirm" id="check-balance-btn" style="padding:10px 25px; font-size:1rem; margin-right:0;">Войти</button>
            <button class="btn-danger" id="reset-session-btn" style="padding:10px 25px; font-size:1rem; display:none;">Сменить ник</button>
        </div>
        <ul id="cart-items"><li class="empty-cart">Пока пусто</li></ul>
        <div class="cart-total">Итого: <span id="total-price">0</span> VC</div>
        <button class="btn-buy" id="buy-btn">Оформить заказ</button>
    </section>

    <!-- ===== ЧЕК ===== -->
    <section class="check-section hidden" id="check-section">
        <h2>🧾 Ваш чек</h2>
        <div id="check-content"></div>
    </section>

</div>

<script>
    // ============================================================
    // ========== КОНФИГ FIREBASE (ВСТАВЬТЕ СВОЙ) ==========
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyA2CA6zopiJpxSuWjSn0svdpVUV2gdJjAc",
        authDomain: "void-e6363.firebaseapp.com",
        databaseURL: "https://void-e6363-default-rtdb.firebaseio.com",
        projectId: "void-e6363",
        storageBucket: "void-e6363.firebasestorage.app",
        messagingSenderId: "123260153615",
        appId: "1:123260153615:web:83e7682dbfa72e6c6c987a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ============================================================
    // ========== ДАННЫЕ ==========
    // ============================================================
    let cart = [];
    let servicesData = [];
    let currentOrder = null;
    let sessionNick = '';
    let sessionPassword = '';

    // ============================================================
    // ========== СЛУШАТЕЛИ БАЛАНСА (ОБНОВЛЕНИЕ В РЕАЛЬНОМ ВРЕМЕНИ) ==========
    // ============================================================
    function listenBalance(nick) {
        if (!nick) return;
        const balanceRef = db.ref('balances/' + nick);
        balanceRef.on('value', (snapshot) => {
            const val = snapshot.val() || 0;
            document.getElementById('header-balance').textContent = val;
        });
    }

    // ============================================================
    // ========== ФУНКЦИИ РАБОТЫ С БАЗОЙ ==========
    // ============================================================
    function getBalance(nick) {
        // читаем один раз (для проверки при заказе)
        return db.ref('balances/' + nick).once('value').then(snap => snap.val() || 0);
    }

    function setBalance(nick, amount) {
        return db.ref('balances/' + nick).set(amount);
    }

    function getPassword(nick) {
        return db.ref('passwords/' + nick).once('value').then(snap => snap.val() || null);
    }

    function setPassword(nick, pass) {
        return db.ref('passwords/' + nick).set(pass);
    }

    function saveOrder(order) {
        return db.ref('orders/' + order.code).set(order);
    }

    // ============================================================
    // ========== ЗАГРУЗКА УСЛУГ ==========
    // ============================================================
    fetch('services.json')
        .then(res => {
            if (!res.ok) throw new Error('Не удалось загрузить услуги');
            return res.json();
        })
        .then(data => {
            servicesData = data;
            renderServices(data);
        })
        .catch(err => {
            document.getElementById('services-list').innerHTML =
                `<p style="color:#a99bc9; grid-column:1/-1; text-align:center;">⚠️ Не удалось загрузить услуги.</p>`;
            console.error(err);
        });

    function renderServices(services) {
        const container = document.getElementById('services-list');
        container.innerHTML = '';
        services.forEach(service => {
            const card = document.createElement('div');
            card.className = 'service-card';
            card.innerHTML = `
                <h3>${service.name}</h3>
                <p>${service.description}</p>
                <span class="price">${service.price} VC</span>
                <button onclick="addToCart(${service.id})">В корзину</button>
            `;
            container.appendChild(card);
        });
    }

    // ============================================================
    // ========== КОРЗИНА ==========
    // ============================================================
    function addToCart(id) {
        if (!sessionNick) {
            alert('Сначала войдите как игрок (введите ник и пароль)');
            return;
        }
        const service = servicesData.find(s => s.id === id);
        if (!service) return;
        cart.push(service);
        updateCart();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCart();
    }

    function updateCart() {
        const list = document.getElementById('cart-items');
        const totalSpan = document.getElementById('total-price');
        list.innerHTML = '';
        if (cart.length === 0) {
            list.innerHTML = '<li class="empty-cart">Пока пусто</li>';
            totalSpan.textContent = '0';
            return;
        }
        let sum = 0;
        cart.forEach((item, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="cart-item-info">
                    <span class="item-name">${item.name}</span>
                    <span>${item.price} VC</span>
                    <button class="btn-remove" onclick="removeFromCart(${index})">✕</button>
                </div>
            `;
            list.appendChild(li);
            sum += item.price;
        });
        totalSpan.textContent = sum;
    }

    // ============================================================
    // ========== ВХОД ИГРОКА ==========
    // ============================================================
    document.getElementById('check-balance-btn').addEventListener('click', async () => {
        const nick = document.getElementById('player-nick').value.trim();
        const password = document.getElementById('player-password').value.trim();

        if (!nick || !password) {
            alert('Введите ник и пароль!');
            return;
        }

        const storedPass = await getPassword(nick);
        if (storedPass === null) {
            // Первый вход — устанавливаем пароль
            await setPassword(nick, password);
            await setBalance(nick, 0);
            alert(`✅ Пароль для ника ${nick} установлен!`);
        } else if (storedPass !== password) {
            alert('❌ Неверный пароль!');
            return;
        }

        sessionNick = nick;
        sessionPassword = password;
        document.getElementById('player-nick').value = '';
        document.getElementById('player-password').value = '';
        document.getElementById('player-nick').disabled = true;
        document.getElementById('player-password').disabled = true;
        document.getElementById('check-balance-btn').style.display = 'none';
        document.getElementById('reset-session-btn').style.display = 'inline-block';
        document.getElementById('session-nick').textContent = nick;
        listenBalance(nick);
        cart = [];
        updateCart();
        alert(`✅ Вы вошли как ${nick}.`);
    });

    document.getElementById('reset-session-btn').addEventListener('click', () => {
        sessionNick = '';
        sessionPassword = '';
        document.getElementById('player-nick').disabled = false;
        document.getElementById('player-password').disabled = false;
        document.getElementById('player-nick').value = '';
        document.getElementById('player-password').value = '';
        document.getElementById('check-balance-btn').style.display = 'inline-block';
        document.getElementById('reset-session-btn').style.display = 'none';
        document.getElementById('header-balance').textContent = '0';
        document.getElementById('session-nick').textContent = 'Не выбран';
        cart = [];
        updateCart();
        // отписываемся от баланса
        db.ref('balances/' + sessionNick).off();
        alert('🔄 Сессия сброшена.');
    });

    // ============================================================
    // ========== ГЕНЕРАЦИЯ ЧЕКА ==========
    // ============================================================
    function generateOrderCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 8; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
    }

    function createCheck(nick, items, total, code) {
        const timestamp = new Date().toLocaleString();
        const orderData = {
            code,
            nick,
            items,
            total,
            timestamp,
            confirmed: false
        };

        saveOrder(orderData);

        const qrText = `ЧЕК №${code}\nНик: ${nick}\nСумма: ${total} VC\nДата: ${timestamp}`;
        const itemsHtml = items.map(item => `<li><span>${item.name}</span><span>${item.price} VC</span></li>`).join('');

        document.getElementById('check-content').innerHTML = `
            <div class="check-block">
                <div class="qr" id="qr-container"></div>
                <div class="info">
                    <p><span class="code">ЧЕК №${code}</span></p>
                    <p><span>Игрок:</span> ${nick}</p>
                    <p><span>Сумма:</span> ${total} VC</p>
                    <p><span>Дата:</span> ${timestamp}</p>
                    <p><span>Услуги:</span></p>
                    <ul>${itemsHtml}</ul>
                    <p style="color:#7a6a9a; margin-top:10px;">⏳ Статус: <span style="color:#ffb347;">Ожидает подтверждения</span></p>
                </div>
            </div>
        `;

        const qrContainer = document.getElementById('qr-container');
        new QRCode(qrContainer, {
            text: qrText,
            width: 150,
            height: 150,
            colorDark: '#0b081a',
            colorLight: '#ffffff'
        });

        document.getElementById('check-section').classList.remove('hidden');
        currentOrder = orderData;
    }

    // ============================================================
    // ========== ОФОРМЛЕНИЕ ЗАКАЗА ==========
    // ============================================================
    document.getElementById('buy-btn').addEventListener('click', async () => {
        if (!sessionNick) {
            alert('Сначала войдите как игрок (введите ник и пароль)');
            return;
        }

        if (cart.length === 0) {
            alert('Корзина пуста!');
            return;
        }

        const checkPass = prompt('Введите пароль от вашего ника для подтверждения заказа:');
        if (checkPass !== sessionPassword) {
            alert('❌ Неверный пароль! Заказ отменён.');
            return;
        }

        const total = cart.reduce((sum, item) => sum + item.price, 0);
        const balance = await getBalance(sessionNick);

        if (balance < total) {
            alert(`❌ Недостаточно VC. Ваш баланс: ${balance} VC, а сумма заказа: ${total} VC.`);
            return;
        }

        await setBalance(sessionNick, balance - total);

        const code = generateOrderCode();
        const items = cart.map(item => ({ name: item.name, price: item.price }));
        createCheck(sessionNick, items, total, code);

        cart = [];
        updateCart();
        alert(`✅ Заказ оформлен! Чек №${code} сгенерирован.`);
    });

    // ============================================================
    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    // ============================================================
    updateCart();
</script>
</body>
</html>
