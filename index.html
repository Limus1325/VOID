<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID · RichClan Shop</title>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b081a;
            color: #d9d0f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 30px 20px 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 1200px; width: 100%; }
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #3b2b5a;
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .logo-svg { width: 70px; height: 70px; flex-shrink: 0; }
        .logo-svg svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 15px #7a4cff66); }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #b79aff, #7a4cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header .currency {
            margin-left: auto;
            background: #241d3a;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #5b3f8a;
            font-weight: 600;
            font-size: 1.1rem;
            color: #c6b5ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .currency .balance-box {
            background: #0f0c1e;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #5b3f8a;
            font-size: 1rem;
            color: #e5daff;
        }
        .header .auth-area {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #130f21;
            padding: 6px 12px 6px 18px;
            border-radius: 60px;
            border: 1px solid #32284a;
            flex-wrap: wrap;
        }
        .header .auth-area .user-label { color: #7a6a9a; font-size: 0.9rem; }
        .header .auth-area .user-name { color: #b79aff; font-weight: 600; }
        .header .auth-btn, .header .logout-btn {
            background: #2a1f42;
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            color: #c6b5ff;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .header .auth-btn:hover, .header .logout-btn:hover {
            background: #3b2b5a;
            color: #fff;
        }
        .header .auth-btn.green {
            background: #1d3a2a;
            color: #8bffb0;
        }
        .header .auth-btn.green:hover { background: #2a4a3a; }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            margin: 30px 0 50px;
        }
        .service-card {
            background: #18122b;
            border: 1px solid #32284a;
            border-radius: 20px;
            padding: 22px 18px 20px;
            transition: 0.25s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }
        .service-card:hover {
            border-color: #9b7bff;
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(100, 60, 255, 0.25);
        }
        .service-card h3 { font-size: 1.3rem; margin-bottom: 8px; color: #e5daff; }
        .service-card p { color: #a99bc9; font-size: 0.95rem; line-height: 1.5; flex-grow: 1; margin-bottom: 16px; }
        .service-card .price { font-weight: 700; font-size: 1.2rem; color: #b48aff; margin-bottom: 16px; display: block; }
        .service-card button {
            background: #6b47d9;
            border: none;
            border-radius: 40px;
            padding: 12px 0;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            letter-spacing: 0.5px;
        }
        .service-card button:hover { background: #8b6aff; box-shadow: 0 0 20px #6b47d966; }
        .cart-section, .admin-section {
            background: #130f21;
            border-radius: 28px;
            padding: 28px 30px;
            border: 1px solid #32284a;
            margin-top: 20px;
        }
        .cart-section h2, .admin-section h2 { font-size: 1.8rem; margin-bottom: 16px; color: #d4c5ff; display: flex; align-items: center; gap: 12px; }
        .cart-section ul, .admin-section ul { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .cart-section li, .admin-section li { padding: 8px 0; border-bottom: 1px solid #26203b; display: flex; justify-content: space-between; align-items: center; font-size: 1rem; }
        .cart-item-info { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .cart-item-info .item-name { flex: 1; }
        .cart-total { font-size: 1.4rem; font-weight: 700; color: #c2adff; margin: 10px 0 20px; }
        .btn-buy, .btn-confirm, .btn-give, .btn-remove {
            background: #a07cff;
            border: none;
            border-radius: 60px;
            padding: 14px 40px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #0b081a;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 0 20px #7a4cff55;
            margin-right: 15px;
        }
        .btn-buy:hover, .btn-confirm:hover, .btn-give:hover { background: #bea5ff; box-shadow: 0 0 40px #7a4cffaa; transform: scale(1.02); }
        .btn-remove {
            background: #4a2a4a;
            color: #d9d0f0;
            padding: 4px 14px;
            font-size: 0.85rem;
            box-shadow: none;
            margin-right: 0;
        }
        .btn-remove:hover { background: #6a3a5a; }
        .btn-danger { background: #4a2a4a; color: #d9d0f0; }
        .btn-danger:hover { background: #6a3a5a; }
        .empty-cart { color: #7a6a9a; font-style: italic; }
        .order-code { background: #0b081a; padding: 15px 25px; border-radius: 60px; border: 1px solid #6b47d9; font-size: 1.8rem; font-weight: 700; letter-spacing: 3px; color: #b79aff; display: inline-block; margin: 10px 0 20px; }
        .order-info { background: #18122b; border-radius: 16px; padding: 15px 20px; margin: 15px 0; border-left: 4px solid #9b7bff; }
        .order-info p { margin: 6px 0; color: #c6b5ff; }
        .order-info span { color: #e5daff; font-weight: 600; }
        .flex-row { display: flex; align-items: center; flex-wrap: wrap; gap: 15px; }
        .hidden { display: none; }
        .nick-input, .auth-input, .give-input {
            background: #0b081a;
            border: 1px solid #3b2b5a;
            color: #d9d0f0;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
        }
        .nick-input { width: 200px; }
        .auth-input, .give-input { width: 140px; }
        .nick-input:focus, .auth-input:focus, .give-input:focus { border-color: #9b7bff; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #130f21;
            padding: 30px 35px;
            border-radius: 28px;
            border: 1px solid #5b3f8a;
            max-width: 400px;
            width: 90%;
        }
        .modal-box h3 { color: #d4c5ff; margin-bottom: 20px; }
        .modal-box .flex-row { gap: 10px; flex-direction: column; align-items: stretch; }
        .modal-box .btn-confirm { padding: 10px 25px; font-size: 1rem; width: 100%; margin-right: 0; }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: #7a6a9a;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-close:hover { color: #fff; }
        .auth-msg { color: #7a6a9a; font-size: 0.9rem; margin-top: 8px; text-align: center; }
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header .currency { margin-left: 0; flex-wrap: wrap; }
            .header .auth-area { width: 100%; justify-content: space-between; }
            .services-grid { grid-template-columns: 1fr; }
            .flex-row { flex-direction: column; align-items: stretch; }
            .nick-input, .auth-input, .give-input { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== ШАПКА ===== -->
    <header class="header">
        <div class="logo-svg">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polyline points="-10.0,-6.51 -7.27,-3.57 -4.54,-0.64 -1.81,2.3 0.02,4.67" stroke="#9b7bff" stroke-width="1.2" fill="none"/>
                <polyline points="-10.0,-6.51 -6.0,-6.51 -2.0,-6.51 2.0,-6.51 6.0,-6.51 9.99,-6.51" stroke="#9b7bff" stroke-width="1.2" fill="none"/>
                <polyline points="-5.04,-4.53 -4.84,-0.54 -4.74,-0.24" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="-5.04,-4.53 -1.04,-4.53 2.96,-4.53 4.76,-4.53" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="-4.74,-0.24 -0.74,-0.24 3.26,-0.24 4.76,-0.24" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="-4.74,-0.24 -1.73,-2.88 1.28,-5.52 1.34,-5.55" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="0.02,4.67 2.85,1.86 4.76,-0.24" stroke="#7a4cff" stroke-width="1.2" fill="none"/>
                <polyline points="0.02,4.67 2.75,1.75 5.48,-1.17 8.21,-4.09 9.99,-6.51" stroke="#7a4cff" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
                <polyline points="1.34,-5.55 4.36,-2.91 4.76,-2.44" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <polyline points="4.76,-4.53 4.76,-0.54 4.76,-0.24" stroke="#b79aff" stroke-width="1.2" fill="none"/>
                <circle cx="0.02" cy="4.67" r="0.4" fill="#9b7bff" opacity="0.8"/>
                <circle cx="-10.0" cy="-6.51" r="0.4" fill="#7a4cff" opacity="0.6"/>
                <circle cx="9.99" cy="-6.51" r="0.4" fill="#7a4cff" opacity="0.6"/>
            </svg>
        </div>
        <h1>VOID · RichClan</h1>
        <span class="currency">
            💎 VC
            <span class="balance-box" id="header-balance">0</span>
        </span>

        <div class="auth-area" id="auth-area">
            <span class="user-label">👤</span>
            <span class="user-name" id="user-display">Гость</span>
            <button class="auth-btn" id="login-btn">Вход</button>
            <button class="auth-btn green" id="register-btn-header">Регистрация</button>
            <button class="logout-btn hidden" id="logout-btn">Выйти</button>
        </div>
    </header>

    <!-- ===== УСЛУГИ ===== -->
    <div id="services-list" class="services-grid"></div>

    <!-- ===== КОРЗИНА ===== -->
    <section class="cart-section">
        <h2>🛒 Корзина</h2>
        <div class="flex-row" style="margin-bottom: 20px;">
            <input type="text" id="player-nick" class="nick-input" placeholder="Ваш игровой ник" required>
            <span style="color:#7a6a9a; font-size:0.9rem;">(обязательно для заказа)</span>
        </div>
        <ul id="cart-items"><li class="empty-cart">Пока пусто</li></ul>
        <div class="cart-total">Итого: <span id="total-price">0</span> VC</div>
        <button class="btn-buy" id="buy-btn">Оформить заказ</button>
    </section>

    <!-- ===== АДМИН-ПАНЕЛЬ (СКРЫТА ДЛЯ НЕ-АДМИНОВ) ===== -->
    <section class="admin-section hidden" id="admin-panel">
        <h2>🔐 Админ-панель</h2>
        <div id="admin-content"></div>
    </section>

</div>

<!-- ===== МОДАЛЬНЫЕ ОКНА ===== -->
<div class="modal-overlay" id="auth-modal">
    <div class="modal-box">
        <button class="modal-close" id="modal-close">✕</button>
        <h3 id="modal-title">Вход</h3>
        <div id="modal-body"></div>
        <div id="modal-msg" class="auth-msg"></div>
    </div>
</div>

<script type="module">
    // ============================================================
    // ========== ИМПОРТ FIREBASE ==========
    // ============================================================
    import { initializeApp } from 'firebase/app';
    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    } from 'firebase/auth';
    import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        updateDoc,
        collection,
        query,
        where,
        getDocs
    } from 'firebase/firestore';

    // ============================================================
    // ========== КОНФИГУРАЦИЯ FIREBASE ==========
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyA2CA6zopiJpxSuWjSn0svdpVUV2gdJjAc",
        authDomain: "void-e6363.firebaseapp.com",
        databaseURL: "https://void-e6363-default-rtdb.firebaseio.com",
        projectId: "void-e6363",
        storageBucket: "void-e6363.firebasestorage.app",
        messagingSenderId: "123260153615",
        appId: "1:123260153615:web:83e7682dbfa72e6c6c987a",
        measurementId: "G-Y6FV25WY7Y"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ============================================================
    // ========== ДАННЫЕ ПРИЛОЖЕНИЯ ==========
    // ============================================================
    let cart = [];
    let servicesData = [];
    let activeOrder = null;
    let currentUser = null;
    let currentUserNick = null;

    // ============================================================
    // ========== ФУНКЦИИ ДЛЯ FIRESTORE ==========
    // ============================================================
    async function getUserData(nick) {
        if (!nick) return null;
        const docRef = doc(db, "users", nick);
        const docSnap = await getDoc(docRef);
        return docSnap.exists() ? docSnap.data() : null;
    }

    async function getBalance(nick) {
        const data = await getUserData(nick);
        return data?.balance || 0;
    }

    async function setBalance(nick, amount) {
        const docRef = doc(db, "users", nick);
        await setDoc(docRef, { balance: Math.max(0, amount) }, { merge: true });
        if (currentUserNick === nick) {
            document.getElementById('header-balance').textContent = amount;
        }
    }

    async function addBalance(nick, amount) {
        const current = await getBalance(nick);
        await setBalance(nick, current + amount);
    }

    // ============================================================
    // ========== ЗАГРУЗКА УСЛУГ ==========
    // ============================================================
    fetch('services.json')
        .then(res => {
            if (!res.ok) throw new Error('Не удалось загрузить услуги');
            return res.json();
        })
        .then(data => {
            servicesData = data;
            renderServices(data);
        })
        .catch(err => {
            document.getElementById('services-list').innerHTML =
                `<p style="color:#a99bc9; grid-column:1/-1; text-align:center;">⚠️ Не удалось загрузить услуги.</p>`;
            console.error(err);
        });

    function renderServices(services) {
        const container = document.getElementById('services-list');
        container.innerHTML = '';
        services.forEach(service => {
            const card = document.createElement('div');
            card.className = 'service-card';
            card.innerHTML = `
                <h3>${service.name}</h3>
                <p>${service.description}</p>
                <span class="price">${service.price} VC</span>
                <button onclick="window.addToCart(${service.id})">В корзину</button>
            `;
            container.appendChild(card);
        });
    }

    window.addToCart = function(id) {
        const service = servicesData.find(s => s.id === id);
        if (!service) return;
        cart.push(service);
        updateCart();
    };

    // ===== УДАЛЕНИЕ ИЗ КОРЗИНЫ =====
    window.removeFromCart = function(index) {
        cart.splice(index, 1);
        updateCart();
    };

    function updateCart() {
        const list = document.getElementById('cart-items');
        const totalSpan = document.getElementById('total-price');
        list.innerHTML = '';
        if (cart.length === 0) {
            list.innerHTML = '<li class="empty-cart">Пока пусто</li>';
            totalSpan.textContent = '0';
            return;
        }
        let sum = 0;
        cart.forEach((item, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="cart-item-info">
                    <span class="item-name">${item.name}</span>
                    <span>${item.price} VC</span>
                    <button class="btn-remove" onclick="window.removeFromCart(${index})">✕</button>
                </div>
            `;
            list.appendChild(li);
            sum += item.price;
        });
        totalSpan.textContent = sum;
    }

    // ============================================================
    // ========== ГЕНЕРАЦИЯ КОДА ==========
    // ============================================================
    function generateOrderCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 8; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
    }

    // ============================================================
    // ========== ОФОРМЛЕНИЕ ЗАКАЗА ==========
    // ============================================================
    document.getElementById('buy-btn').addEventListener('click', async () => {
        const nickInput = document.getElementById('player-nick');
        const nick = nickInput.value.trim();

        if (!nick) {
            alert('Укажите ваш игровой ник!');
            nickInput.focus();
            return;
        }
        if (cart.length === 0) {
            alert('Корзина пуста!');
            return;
        }
        if (activeOrder && !activeOrder.confirmed) {
            if (!confirm('Заменить активный заказ новым?')) return;
        }

        const total = cart.reduce((sum, item) => sum + item.price, 0);
        const balance = await getBalance(nick);
        if (balance < total) {
            alert(`❌ Недостаточно VC. Баланс: ${balance} VC`);
            return;
        }

        const code = generateOrderCode();
        await addBalance(nick, -total);

        const items = cart.map(item => ({ name: item.name, price: item.price }));
        activeOrder = { code, nick, items, total, timestamp: new Date().toLocaleString(), confirmed: false };

        try {
            const orderRef = doc(db, "orders", code);
            await setDoc(orderRef, {
                nick,
                items,
                total,
                timestamp: new Date().toISOString(),
                confirmed: false
            });
        } catch (e) {
            console.error("Ошибка сохранения заказа:", e);
            await addBalance(nick, total);
            alert('❌ Ошибка при оформлении заказа.');
            return;
        }

        cart = [];
        updateCart();
        nickInput.value = '';
        if (currentUserNick === nick) {
            document.getElementById('header-balance').textContent = await getBalance(nick);
        }
        alert(`✅ Заказ оформлен!\nКод: ${code}\nНик: ${nick}\nСумма: ${total} VC`);
        renderAdminPanel();
    });

    // ============================================================
    // ========== АВТОРИЗАЦИЯ ==========
    // ============================================================
    const modal = document.getElementById('auth-modal');
    const modalBody = document.getElementById('modal-body');
    const modalTitle = document.getElementById('modal-title');
    const modalMsg = document.getElementById('modal-msg');

    function openModal(title, html) {
        modalTitle.textContent = title;
        modalBody.innerHTML = html;
        modalMsg.textContent = '';
        modal.classList.add('active');
    }

    document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('active'));
    window.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

    // ---- Регистрация ----
    document.getElementById('register-btn-header').addEventListener('click', () => {
        openModal('Регистрация', `
            <div class="flex-row">
                <input type="email" id="reg-email" class="auth-input" placeholder="Email" style="width:100%;">
                <input type="password" id="reg-password" class="auth-input" placeholder="Пароль" style="width:100%;">
                <input type="text" id="reg-nick" class="auth-input" placeholder="Ваш игровой ник" style="width:100%;">
                <button class="btn-confirm" id="modal-register-btn" style="width:100%;">Создать аккаунт</button>
            </div>
        `);
        document.getElementById('modal-register-btn').addEventListener('click', async () => {
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const nick = document.getElementById('reg-nick').value.trim();

            if (!email || !password || !nick) {
                modalMsg.textContent = '❌ Заполните все поля';
                modalMsg.style.color = '#ff6b6b';
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", nick), {
                    uid: userCredential.user.uid,
                    email: email,
                    balance: 0,
                    createdAt: new Date().toISOString()
                });
                modalMsg.textContent = '✅ Аккаунт создан!';
                modalMsg.style.color = '#b79aff';
                setTimeout(() => modal.classList.remove('active'), 1200);
            } catch (error) {
                let msg = '❌ Ошибка регистрации.';
                if (error.code === 'auth/email-already-in-use') msg = '❌ Email уже используется.';
                else if (error.code === 'auth/weak-password') msg = '❌ Слишком слабый пароль.';
                modalMsg.textContent = msg;
                modalMsg.style.color = '#ff6b6b';
                console.error(error);
            }
        });
    });

    // ---- Вход ----
    document.getElementById('login-btn').addEventListener('click', () => {
        openModal('Вход', `
            <div class="flex-row">
                <input type="email" id="login-email" class="auth-input" placeholder="Email" style="width:100%;">
                <input type="password" id="login-password" class="auth-input" placeholder="Пароль" style="width:100%;">
                <button class="btn-confirm" id="modal-login-btn" style="width:100%;">Войти</button>
            </div>
        `);
        document.getElementById('modal-login-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!email || !password) {
                modalMsg.textContent = '❌ Заполните оба поля';
                modalMsg.style.color = '#ff6b6b';
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                modalMsg.textContent = '✅ Вход выполнен';
                modalMsg.style.color = '#b79aff';
                setTimeout(() => modal.classList.remove('active'), 1000);
            } catch (error) {
                let msg = '❌ Неверный email или пароль.';
                if (error.code === 'auth/user-not-found') msg = '❌ Пользователь не найден.';
                else if (error.code === 'auth/wrong-password') msg = '❌ Неверный пароль.';
                modalMsg.textContent = msg;
                modalMsg.style.color = '#ff6b6b';
                console.error(error);
            }
        });
    });

    // ---- Выход ----
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await signOut(auth);
    });

    // ============================================================
    // ========== СОСТОЯНИЕ АУТЕНТИФИКАЦИИ ==========
    // ============================================================
    const adminEmails = ['admin@void.com', 'fox@void.com']; // <--- ТОЛЬКО ЭТИ ПОЛЬЗОВАТЕЛИ ВИДЯТ АДМИНКУ

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            const usersRef = collection(db, "users");
            const q = query(usersRef, where("uid", "==", user.uid));
            const querySnapshot = await getDocs(q);
            if (!querySnapshot.empty) {
                const docData = querySnapshot.docs[0].data();
                currentUserNick = querySnapshot.docs[0].id;
                document.getElementById('header-balance').textContent = docData.balance || 0;
            } else {
                currentUserNick = null;
                document.getElementById('header-balance').textContent = '0';
            }
            updateAuthUI(true, user.email);
            renderAdminPanel(); // <--- админка показывается ТОЛЬКО если email в списке
            modal.classList.remove('active');
        } else {
            currentUser = null;
            currentUserNick = null;
            document.getElementById('header-balance').textContent = '0';
            updateAuthUI(false);
            document.getElementById('admin-panel').classList.add('hidden');
        }
    });

    function updateAuthUI(isLoggedIn, email = '') {
        const display = document.getElementById('user-display');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn-header');
        const logoutBtn = document.getElementById('logout-btn');

        if (isLoggedIn) {
            display.textContent = email || currentUser?.email || 'Пользователь';
            loginBtn.classList.add('hidden');
            registerBtn.classList.add('hidden');
            logoutBtn.classList.remove('hidden');
        } else {
            display.textContent = 'Гость';
            loginBtn.classList.remove('hidden');
            registerBtn.classList.remove('hidden');
            logoutBtn.classList.add('hidden');
        }
    }

    // ============================================================
    // ========== АДМИН-ПАНЕЛЬ (ТОЛЬКО ДЛЯ ADMIN EMAILS) ==========
    // ============================================================
    async function renderAdminPanel() {
        const panel = document.getElementById('admin-panel');
        const content = document.getElementById('admin-content');

        if (!currentUser) {
            panel.classList.add('hidden');
            return;
        }

        // Проверяем, входит ли email текущего пользователя в список админов
        if (!adminEmails.includes(currentUser.email)) {
            panel.classList.add('hidden');
            return;
        }

        // Если админ — показываем панель
        panel.classList.remove('hidden');

        // Загружаем активные заказы
        let ordersHtml = '';
        try {
            const ordersRef = collection(db, "orders");
            const q = query(ordersRef, where("confirmed", "==", false));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                const docData = querySnapshot.docs[0].data();
                const itemsList = docData.items.map(item =>
                    `<li><span>${item.name}</span><span>${item.price} VC</span></li>`
                ).join('');
                ordersHtml = `
                    <div class="order-info">
                        <p><span>Код:</span> <span class="order-code">${querySnapshot.docs[0].id}</span></p>
                        <p><span>Игрок:</span> ${docData.nick}</p>
                        <p><span>Время:</span> ${new Date(docData.timestamp).toLocaleString()}</p>
                        <p><span>Сумма:</span> ${docData.total} VC</p>
                        <p><span>Услуги:</span></p>
                        <ul>${itemsList}</ul>
                    </div>
                    <div class="flex-row">
                        <button class="btn-confirm" id="confirm-order-btn">✅ Подтвердить</button>
                        <button class="btn-confirm btn-danger" id="cancel-order-btn">❌ Отменить</button>
                    </div>
                `;
            } else {
                ordersHtml = `<p style="color:#7a6a9a;">Нет активных заказов.</p>`;
            }
        } catch (e) {
            console.error("Ошибка загрузки заказов:", e);
            ordersHtml = `<p style="color:#ff6b6b;">Ошибка загрузки заказов.</p>`;
        }

        content.innerHTML = `
            ${ordersHtml}
            <hr style="border-color:#26203b; margin:25px 0;">
            <div style="margin-top:15px;">
                <h3 style="color:#c6b5ff; margin-bottom:12px;">💎 Выдать VC</h3>
                <div class="flex-row">
                    <input type="text" id="give-nick" class="give-input" placeholder="Ник игрока">
                    <input type="number" id="give-amount" class="give-input" placeholder="Сумма" min="1">
                    <button class="btn-give" id="give-btn">Выдать</button>
                </div>
                <div id="give-msg" class="auth-msg"></div>
            </div>
        `;

        // Подтверждение заказа
        document.getElementById('confirm-order-btn')?.addEventListener('click', async () => {
            try {
                const ordersRef = collection(db, "orders");
                const q = query(ordersRef, where("confirmed", "==", false));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    const docRef = querySnapshot.docs[0].ref;
                    await updateDoc(docRef, { confirmed: true });
                    alert('✅ Заказ подтверждён!');
                    renderAdminPanel();
                }
            } catch (e) {
                console.error("Ошибка подтверждения:", e);
                alert('❌ Ошибка подтверждения заказа.');
            }
        });

        // Отмена заказа
        document.getElementById('cancel-order-btn')?.addEventListener('click', async () => {
            try {
                const ordersRef = collection(db, "orders");
                const q = query(ordersRef, where("confirmed", "==", false));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    const docData = querySnapshot.docs[0].data();
                    await addBalance(docData.nick, docData.total);
                    await updateDoc(querySnapshot.docs[0].ref, { confirmed: true });
                    alert('❌ Заказ отменён, средства возвращены.');
                    renderAdminPanel();
                }
            } catch (e) {
                console.error("Ошибка отмены:", e);
                alert('❌ Ошибка отмены заказа.');
            }
        });

        // Выдача VC
        document.getElementById('give-btn')?.addEventListener('click', async () => {
            const nick = document.getElementById('give-nick').value.trim();
            const amount = parseInt(document.getElementById('give-amount').value.trim());
            const msg = document.getElementById('give-msg');
            if (!nick) { msg.textContent = '❌ Введите ник'; msg.style.color = '#ff6b6b'; return; }
            if (!amount || amount <= 0) { msg.textContent = '❌ Сумма > 0'; msg.style.color = '#ff6b6b'; return; }
            await addBalance(nick, amount);
            msg.textContent = `✅ Выдано ${amount} VC игроку ${nick}`;
            msg.style.color = '#b79aff';
            document.getElementById('give-nick').value = '';
            document.getElementById('give-amount').value = '';
        });
    }

    // ============================================================
    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    // ============================================================
    updateCart();
</script>
</body>
</html>
